name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://labuser:labpassword@localhost:5432/performance_lab
      REDIS_HOST: localhost
      REDIS_PORT: "6379"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: labuser
          POSTGRES_PASSWORD: labpassword
          POSTGRES_DB: performance_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U labuser -d performance_lab"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -v

